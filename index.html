<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hi Joban, May I Be Your Valentine? 💘</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: 350px;
    }

    h1 {
      color: #ff4d88;
      margin-bottom: 10px;
    }

    img {
      width: 100%;
      border-radius: 15px;
      margin: 10px 0;
    }

    .buttons {
      margin-top: 20px;
      position: relative;
      height: 60px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
    }

    #yesBtn {
      background: #ff4d88;
      color: white;
      left: 40px;
    }

    #noBtn {
      background: #ccc;
      color: #555;
      right: 40px;
    }

    .party {
      position: fixed;
      inset: 0;
      background: #fff0f6;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    .party h1 {
      font-size: 2.5em;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: pink;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      from { transform: translateY(-100px) rotate(0deg); }
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <h1>Hi Joban, May I Be Your Valentine? 💕</h1>

  <!-- Replace with your picture -->
  <img src="https://drive.google.com/file/d/1AqAQ0Ge6nHO9-3p6oMWxRoXrAIv_WUca/view?usp=sharing" alt="Us">

  <!-- Replace with Bubu Dudu / Milk Mocha GIF -->
  <img src="https://media1.tenor.com/m/RcS-_9M4QuwAAAAC/bubu-dudu-kisses.gif" alt="Cute gif">

  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 🙅‍♀️</button>
  </div>
</div>

<div class="party" id="party">
  <h1>YAY!!! 🎉💘</h1>
  <p>Best Valentine ever 🥰</p>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const card = document.getElementById("card");
  const party = document.getElementById("party");

  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 250;
    const y = Math.random() * 40;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  });

  yesBtn.addEventListener("click", () => {
    card.style.display = "none";
    party.style.display = "flex";
    launchConfetti();
  });

  function launchConfetti() {
    for (let i = 0; i < 40; i++) {
      const confetti = document.createElement("div");
      confetti.className = "confetti";
      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.animationDuration = (2 + Math.random() * 2) + "s";
      confetti.style.background =
        ["#ff4d88", "#ffd6e8", "#ff99cc"][Math.floor(Math.random()*3)];
      document.body.appendChild(confetti);
    }
  }
</script>

</body>
</html>
